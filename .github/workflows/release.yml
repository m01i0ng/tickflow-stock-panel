name: 桌面客户端发布

# 触发方式: 手动 (workflow_dispatch)。
# 在 GitHub Actions 页面点 "Run workflow", 选择要构建的平台 + 版本号,
# 全部构建 job 结束后由 publish 一次写入 Release, 避免矩阵互相覆盖说明。
#
# 为什么不用 tag 自动触发:
#   - 多平台并行构建, 某一平台失败时不应污染已有 Release
#   - 手动触发可精确控制 "今天只发 Windows, 明天补 mac"
#   - 版本号必须与 frontend/package.json 一致 (prepare 会校验)
#
# 使用:
#   gh workflow run release.yml -f version=v0.1.88 -f platforms=windows
#   gh workflow run release.yml -f version=v0.1.88 -f platforms=windows,macos
#   或 GitHub 网页 Actions → 桌面客户端发布 → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (必须与 frontend/package.json 一致, 如 v0.1.88)'
        required: true
      platforms:
        description: '要构建的平台 (逗号分隔: windows,macos)'
        required: true
        default: 'windows,macos'
      prerelease:
        description: '是否为预发布 (勾选则标记为 Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      platforms: ${{ steps.filter.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        env:
          REQUESTED: ${{ github.event.inputs.platforms }}
          VERSION: ${{ github.event.inputs.version }}
          ALL: '[{"os":"windows-latest","artifact":"TickFlowStockPanel-Setup-x64.exe","platform":"windows"},{"os":"macos-26","artifact":"TickFlowStockPanel-macos-arm64.dmg","platform":"macos","arch":"arm64"}]'
        run: |
          python3 <<'PY'
          import json, os, pathlib, sys

          requested = [r.strip() for r in os.environ["REQUESTED"].split(",") if r.strip()]
          all_platforms = json.loads(os.environ["ALL"])
          known = {p["platform"] for p in all_platforms}
          unknown = [r for r in requested if r not in known]
          if unknown:
              print(f"未知平台: {unknown}。可用: windows,macos", file=sys.stderr)
              sys.exit(1)
          selected = [p for p in all_platforms if p["platform"] in requested]
          if not selected:
              print("未选中任何平台。platforms 例如: windows 或 windows,macos", file=sys.stderr)
              sys.exit(1)

          pkg_ver = json.loads(pathlib.Path("frontend/package.json").read_text(encoding="utf-8"))["version"]
          input_ver = os.environ["VERSION"]
          if input_ver != f"v{pkg_ver}":
              print(
                  f"version 输入 {os.environ['VERSION']!r} 与 frontend/package.json {pkg_ver!r} 不一致",
                  file=sys.stderr,
              )
              sys.exit(1)

          matrix = json.dumps({"include": selected})
          platforms = ",".join(p["platform"] for p in selected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={matrix}\n")
              fh.write(f"platforms={platforms}\n")
          print(f"matrix={matrix}")
          print(f"platforms={platforms}")
          PY

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 构建前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: 0.12.5

      - name: 设置 Python
        run: uv python install 3.12

      - name: 安装后端依赖 (含 desktop + legacy-cpu, 不含 backtest)
        working-directory: backend
        # --no-dev 排除 pytest/ruff/mypy; --extra desktop 装 pywebview
        # --extra legacy-cpu 装 polars[rtcompat] 运行时兼容内核
        run: uv sync --frozen --no-dev --extra desktop --extra legacy-cpu

      - name: 安装固定版本 PyInstaller
        working-directory: backend
        run: uv pip install pyinstaller==6.22.2

      - name: 生成 macOS 图标 (仅 macOS)
        if: matrix.platform == 'macos'
        # icon.ico / icon.icns 均已入库; 现场再生成一次保证 BUNDLE 用到最新 icns。
        working-directory: backend
        run: uv run python ../packaging/generate_icon.py

      - name: 打包 (PyInstaller)
        working-directory: backend
        run: uv run pyinstaller ../packaging/tickflow.spec --noconfirm

      - name: 检查 Polars 兼容内核 (仅 Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $runtimeRoot = 'backend/dist/TickFlowStockPanel/_internal'
          $required = @(
            '_polars_runtime_32/_polars_runtime.pyd',
            '_polars_runtime_compat/_polars_runtime.pyd'
          )
          $missing = $required | Where-Object {
            -not (Test-Path (Join-Path $runtimeRoot $_))
          }
          if ($missing) {
            throw "PyInstaller output is missing Polars runtime(s): $($missing -join ', ')"
          }

      - name: 安装 Inno Setup (仅 Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y --no-progress

      - name: 生成 Windows 安装包 (Inno Setup)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ver = (Get-Content frontend/package.json | ConvertFrom-Json).version
          echo "版本号: $ver"
          ISCC.exe "/DMyAppVersion=$ver" packaging/tickflow.iss
          Move-Item packaging/Output/TickFlowStockPanel-Setup-$ver.exe ${{ matrix.artifact }} -Force

      - name: 生成 DMG (macOS)
        if: matrix.platform == 'macos'
        # create-dmg 最后一个参数是源文件夹, 会把该文件夹的【内容】拷进映像。
        # 必须传入「里面放着 TickFlowStockPanel.app」的目录, 不能把 .app 自己当源,
        # 否则 DMG 根上出现 Contents/ 而不是可拖拽的 .app。
        run: |
          brew install create-dmg
          test -d backend/dist/TickFlowStockPanel.app/Contents
          STAGE=$(mktemp -d)
          cp -R backend/dist/TickFlowStockPanel.app "$STAGE/"
          create-dmg \
            --volname "TickFlow Stock Panel" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "TickFlowStockPanel.app" 175 190 \
            --app-drop-link 425 190 \
            --hide-extension "TickFlowStockPanel.app" \
            --skip-jenkins \
            --no-internet-enable \
            "${{ matrix.artifact }}" \
            "$STAGE"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: TickFlowStockPanel-*

      - name: 组装 Release 说明
        id: notes
        env:
          VERSION: ${{ github.event.inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          dist = Path("dist")
          files = {p.name: p for p in dist.iterdir() if p.is_file()}
          if not files:
              raise SystemExit("没有可发布的产物")

          catalog = [
              ("TickFlowStockPanel-Setup-x64.exe", "Windows x64", "windows"),
              ("TickFlowStockPanel-macos-arm64.dmg", "macOS (Apple Silicon / M 系列芯片)", "macos"),
          ]
          rows = []
          present = set()
          for name, label, key in catalog:
              if name in files:
                  url = f"https://github.com/{repo}/releases/download/{version}/{name}"
                  rows.append(f"| **{label}** | `{name}` | [下载]({url}) |")
                  present.add(key)

          notes = []
          if "windows" in present:
              notes.append(
                  "- **Windows**: 双击安装(无需管理员)。Win11 已预装 WebView2; "
                  "部分 Win10 需先装 [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/)。"
                  "未签名, SmartScreen 可能提示「仍要运行」。"
              )
          if "macos" in present:
              notes.append(
                  "- **macOS**: 打开 dmg, 将 TickFlowStockPanel 拖入 Applications; "
                  "未公证, 首次请右键→打开。仅 Apple Silicon。"
              )
          body = "\n".join([
              f"## 桌面客户端 {version}",
              "",
              "### 下载",
              "",
              "| 平台 | 文件 | 链接 |",
              "| :--- | :--- | :--- |",
              *rows,
              "",
              "### 使用说明",
              *notes,
              "- **数据在用户目录, 升级不丢**: Windows `%LOCALAPPDATA%\\TickFlowStockPanel`, macOS `~/Library/Application Support/TickFlowStockPanel`",
              "- 内置 Polars 兼容内核; 不含 vectorbt 回测",
              "- 系统通知: 设置 → 实时监控 → 系统通知",
              "- 检查更新: 设置 → 系统设置 → 关于",
              "",
          ])
          Path("release-body.md").write_text(body, encoding="utf-8")
          print(body)
          PY

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: dist/*
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          body_path: release-body.md
